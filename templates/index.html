<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bhagavad Gita AI Assistant</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <header>
            <!-- Theme Toggle (NEW) -->
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>

            <a href="/download-bhagavad-gita" class="download-button" title="Download Bhagavad Gita PDF"
                aria-label="Download Bhagavad Gita PDF">
                <svg class="download-icon-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span class="download-tooltip">Download PDF</span>
            </a>

            <h1>The Bhagavad Gita</h1>
            <p>Ask questions about the sacred text and get AI-powered insights</p>
        </header>

        <div class="chat-container">
            <div id="chat-box" class="empty-chat">
                <!-- Welcome Message -->
                <div class="message-container">
                    <div class="bot-message">
                        <strong>Namaste!</strong> I'm your Bhagavad Gita assistant. Ask me any question about the sacred
                        text, its philosophy, or specific verses!
                    </div>
                </div>

                <!-- Typing Indicator (Moved INSIDE chat-box so it scrolls with the thread) -->
                <div id="loading" class="typing-indicator" style="display:none;">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Suggestion Chips (NEW) -->
            <div class="suggestions" id="suggestions">
                <button class="chip">What is Dharma?</button>
                <button class="chip">Explain Karma Yoga</button>
                <button class="chip">What does Chapter 2, Verse 47 say?</button>
                <button class="chip">How to control the mind?</button>
            </div>

            <div class="form-control">
                <input type="text" id="user-input" placeholder="Ask a question about Dharma, Karma..." autofocus>
                <button id="send-btn" aria-label="Send Message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>

        <footer>
            <p>Knowledge powered by Gemini • Developed by Navin Karavade &copy; 2026</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
